[workspace]
resolver = "2"
members = [
    "crates/uitap-core",
    "crates/uitap-ops",
    "crates/uitap-macos",
    "crates/uitap-platform",
    "crates/uitap-cli",
    "crates/uitap-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
uitap-core = { path = "crates/uitap-core" }
uitap-ops = { path = "crates/uitap-ops" }
uitap-platform = { path = "crates/uitap-platform" }
uitap-mcp = { path = "crates/uitap-mcp" }
uitap-macos = { path = "crates/uitap-macos" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
